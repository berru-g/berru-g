    function getYearColor(year) {
      const colors = {
        2016: '#ff5722', 2017: '#ff9800', 2018: '#ffc107',
        2019: '#4caf50', 2020: '#8bc34a', 2021: '#2196f3',
        2022: '#3f51b5', 2023: '#673ab7', 2024: '#9c27b0', 2025: '#e91e63'
      };
      return colors[year] || '#999999';
    }

    function getTypeColor(type) {
      const colors = {
        saas: '#4fc3f7', tool: '#8bc34a', website: '#ff9800',
        'e-commerce': '#e91e63', guide: '#673ab7', arduino: '#ff5722',
        jeu: '#2196f3', 'jeu dans navigateur': '#2196f3', other: '#999999',
        guinguette: '#ff9800', contact: '#999999', github: '#999999',
        'Message de bienvenue': '#673ab7', Wikipedia: '#999999', QRcode: '#999999',
        Phylorythme: '#673ab7'
      };
      return colors[type] || '#999999';
    }

    function getTechColor(tech) {
      const colors = {
        'JavaScript': '#4fc3f7', 'PHP': '#ffc107', 'HTML/CSS': '#f44336',
        'HTML': '#f44336', 'CSS': '#f44336', 'Python': '#9c27b0',
        'C++': '#607d8b', 'Three.js': '#4fc3f7', 'WebGL': '#4fc3f7'
      };
      return colors[tech] || '#999999';
    }

    // ============================================
    // CONVERSION EN DONNÉES DE GRAPHE
    // ============================================
    const projectsData = (() => {
      const nodes = [];
      const links = [];

      nodes.push({
        id: 'berru-g',
        name: 'Berru-g',
        type: 'profile',
        shortDesc: 'Développeur Full Stack autodidacte depuis 2020. Artisan du code souverain.',
        color: '#ffffff',
        size: 30,
        link: 'https://github.com/berru-g/',
        year: 2020,
        category: 'profile',
        tech: ['JavaScript', 'PHP', 'Python', 'C++']
      });

      rawProjects.forEach(project => {
        let nodeType, color, nodeSize;
        switch (project.category) {
          case 'saas': nodeType = 'saas'; color = '#4fc3f7'; nodeSize = 20; break;
          case 'tool': nodeType = 'tool'; color = '#8bc34a'; nodeSize = 14; break;
          case 'website': case 'site': nodeType = 'website'; color = '#ff9800'; nodeSize = 14; break;
          case 'e-commerce': nodeType = 'e-commerce'; color = '#e91e63'; nodeSize = 16; break;
          case 'guide': nodeType = 'guide'; color = '#673ab7'; nodeSize = 12; break;
          case 'Arduino': nodeType = 'arduino'; color = '#ff5722'; nodeSize = 14; break;
          case 'jeu dans navigateur': nodeType = 'jeu'; color = '#2196f3'; nodeSize = 14; break;
          default: nodeType = project.category || 'other'; color = '#999999'; nodeSize = 10;
        }

        const year = project.year || 2024;
        const tech = [];

        (project.tags || []).forEach(tag => {
          if (!tag) return;
          const t = tag.toLowerCase();
          if (t.includes('javascript') || t === 'js') tech.push('JavaScript');
          else if (t.includes('php')) tech.push('PHP');
          else if (t.includes('html') || t.includes('css')) tech.push('HTML/CSS');
          else if (t.includes('python')) tech.push('Python');
          else if (t.includes('threejs') || t.includes('webgl')) tech.push('Three.js');
          else if (t.includes('c++') || t.includes('arduino')) tech.push('C++');
        });

        if (tech.length === 0) {
          tech.push(nodeType === 'arduino' ? 'C++' : 'JavaScript');
        }

        nodes.push({
          id: project.id,
          name: project.title,
          type: nodeType,
          shortDesc: project.shortDesc || '',
          longDesc: project.longDesc || '',
          color: color,
          size: nodeSize,
          link: project.link || null,
          year: year,
          category: project.category || 'other',
          keywords: project.keywords || [],
          tech: [...new Set(tech)],
          tags: project.tags || []
        });

        links.push({ source: 'berru-g', target: project.id });
      });

      const years = [...new Set(nodes.map(n => n.year).filter(y => y))].sort((a, b) => a - b);
      years.forEach(year => {
        nodes.push({
          id: `year-${year}`,
          name: year.toString(),
          type: 'category-year',
          description: `Projets de l'année ${year}`,
          color: getYearColor(year),
          size: 6,
          year: year
        });
        nodes.filter(n => n.year === year && !n.id.startsWith('year-')).forEach(node => {
          links.push({ source: node.id, target: `year-${year}` });
        });
      });

      const types = [...new Set(nodes.map(n => n.category).filter(c => c && c !== 'profile'))];
      types.forEach(type => {
        nodes.push({
          id: `type-${type}`,
          name: type.charAt(0).toUpperCase() + type.slice(1),
          type: 'category-type',
          description: `Projets de type ${type}`,
          color: getTypeColor(type),
          size: 5,
          category: type
        });
        nodes.filter(n => n.category === type && !n.id.startsWith('type-')).forEach(node => {
          links.push({ source: node.id, target: `type-${type}` });
        });
      });

      const allTechs = nodes.flatMap(n => n.tech || []).filter(t => t);
      const uniqueTechs = [...new Set(allTechs)];
      uniqueTechs.forEach(tech => {
        nodes.push({
          id: `tech-${tech}`,
          name: tech,
          type: 'category-tech',
          description: `Projets utilisant ${tech}`,
          color: getTechColor(tech),
          size: 4,
          tech: [tech]
        });
        nodes.filter(n => (n.tech || []).includes(tech) && !n.id.startsWith('tech-')).forEach(node => {
          links.push({ source: node.id, target: `tech-${tech}` });
        });
      });

      const statsEl = document.getElementById('stats');
      if (statsEl) {
        statsEl.textContent = `${rawProjects.length} projets | ${nodes.length} nœuds | ${links.length} liens`;
      }

      return { nodes, links };
    })();

    // ============================================
    // ÉTAT GLOBAL
    // ============================================
    let graph = null;
    let rotationEnabled = false;
    let rotationRAF = null;
    let rotationAngle = 0;
    let showLabels = true;
    let searchResults = [];

    // ============================================
    // ÉTOILES
    // ============================================
    function addStarfield(scene) {
      const starsGeometry = new THREE.BufferGeometry();
      const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff, size: 1.2, transparent: true, opacity: 0.8, sizeAttenuation: true
      });
      const starsVertices = [];
      for (let i = 0; i < 2000; i++) {
        starsVertices.push(
          (Math.random() - 0.5) * 3000,
          (Math.random() - 0.5) * 3000,
          (Math.random() - 0.5) * 3000
        );
      }
      starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
      scene.add(new THREE.Points(starsGeometry, starsMaterial));
    }

    // ============================================
    // INITIALISATION DU GRAPHE
    // ============================================
    function initGraph() {
      const container = document.getElementById('container');
      const loadingEl = document.getElementById('loading');

      try {
        graph = ForceGraph3D(container)
          .graphData(projectsData)
          .nodeId('id')
          .nodeLabel(node => (showLabels && node.size > 10) ? node.name : '')
          .nodeColor(node => node.color)
          .nodeVal(node => node.size * 2)
          .nodeOpacity(0.95)
          .nodeResolution(16)
          .linkColor(() => '#444444')
          .linkWidth(1)
          .linkDirectionalArrowLength(4)
          .linkDirectionalArrowRelPos(1)
          .linkCurvature(0.15)
          .linkOpacity(0.6)
          .d3VelocityDecay(0.25)
          .onNodeClick(node => {
            if (node.link && node.link !== '#') {
              window.open(node.link, '_blank', 'noopener,noreferrer');
            }
          })
          .onNodeHover(node => {
            if (node) {
              showNodeInfo(node);
              container.style.cursor = 'pointer';
            } else {
              resetInfoPanel();
              container.style.cursor = 'default';
            }
          })
          .onBackgroundClick(() => {
            resetInfoPanel();
            clearHighlight();
          })
          .width(container.clientWidth)
          .height(container.clientHeight);

        const charge = graph.d3Force('charge');
        if (charge && typeof charge.strength === 'function') {
          charge.strength(-180);
          if (typeof charge.distanceMax === 'function') charge.distanceMax(800);
        }

        const link = graph.d3Force('link');
        if (link && typeof link.distance === 'function') {
          link.distance(70);
          if (typeof link.strength === 'function') link.strength(0.6);
        }

        const center = graph.d3Force('center');
        if (center && typeof center.strength === 'function') {
          center.strength(0.4);
        }

        addStarfield(graph.scene());

        loadingEl.style.display = 'none';

        resetView();
        initSearch();
      } catch (err) {
        console.error('Erreur d\'initialisation du graphe :', err);
        loadingEl.textContent = 'Erreur : ' + err.message;
      }
    }

    // ============================================
    // AFFICHAGE INFO
    // ============================================
    function showNodeInfo(node) {
      const infoPanel = document.getElementById('info-panel');
      let html = `<h2>${escapeHtml(node.name || 'Sans nom')}</h2>`;

      if (node.shortDesc) {
        html += `<div class="detail"><strong>Description:</strong> ${escapeHtml(node.shortDesc)}</div>`;
      }

      const isCategory = node.id.startsWith('year-') || node.id.startsWith('type-') || node.id.startsWith('tech-');

      if (node.type === 'category-year' || node.type === 'category-type' || node.type === 'category-tech') {
        if (node.description) {
          html += `<div class="detail" style="color: #aaa;">${escapeHtml(node.description)}</div>`;
        }
      } else if (!isCategory && node.type !== 'profile') {
        if (node.year) html += `<div class="detail"><strong>Année:</strong> ${node.year}</div>`;
        if (node.category) html += `<div class="detail"><strong>Catégorie:</strong> ${escapeHtml(node.category)}</div>`;
        if (node.tech && node.tech.length) html += `<div class="detail"><strong>Technos:</strong> ${escapeHtml(node.tech.join(', '))}</div>`;
        if (node.keywords && node.keywords.length) html += `<div class="detail"><strong>Mots-clés:</strong> ${escapeHtml(node.keywords.slice(0, 5).join(', '))}</div>`;
        if (node.link && node.link !== '#') {
          html += `<div class="detail"><strong>Lien:</strong> <a href="${escapeAttr(node.link)}" target="_blank" rel="noopener noreferrer">Voir →</a></div>`;
        }
      }

      infoPanel.innerHTML = html;
    }

    function resetInfoPanel() {
      document.getElementById('info-panel').innerHTML = `
        <h2>Mindmap 3D - Projets Berru-g</h2>
        <p style="color: #aaa;">Passez la souris sur un nœud pour voir les détails.</p>
        <p style="color: #aaa; font-size: 12px; margin-top: 10px;">Cliquez sur un nœud pour ouvrir le lien.</p>
      `;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) { return escapeHtml(str); }

    // ============================================
    // CONTRÔLES
    // ============================================
    function resetView() {
      if (!graph) return;
      graph.cameraPosition({ x: 0, y: 0, z: 200 }, { x: 0, y: 0, z: 0 }, 1000);
      graph.d3ReheatSimulation();
      clearHighlight();
    }

    function toggleRotation() {
      rotationEnabled = !rotationEnabled;
      document.getElementById('rotation-status').textContent = rotationEnabled ? 'ON' : 'OFF';

      if (rotationEnabled) {
        if (rotationRAF) cancelAnimationFrame(rotationRAF);
        rotationAngle = 0;
        const rotate = () => {
          if (!rotationEnabled || !graph) { rotationRAF = null; return; }
          rotationAngle += 0.003;
          const r = 200;
          graph.cameraPosition(
            {
              x: Math.sin(rotationAngle) * r,
              y: Math.sin(rotationAngle * 0.7) * 80,
              z: Math.cos(rotationAngle) * r
            },
            { x: 0, y: 0, z: 0 }, 0
          );
          rotationRAF = requestAnimationFrame(rotate);
        };
        rotate();
      } else {
        if (rotationRAF) { cancelAnimationFrame(rotationRAF); rotationRAF = null; }
      }
    }

    function toggleLabels() {
      showLabels = !showLabels;
      if (graph) {
        graph.nodeLabel(node => (showLabels && node.size > 10) ? node.name : '');
      }
    }

    function clearHighlight() {
      searchResults = [];
      if (graph) graph.nodeColor(node => node.color);
      const btn = document.getElementById('highlight-btn');
      if (btn) btn.disabled = true;
      document.getElementById('result-count').classList.remove('show');
      document.getElementById('search-results').classList.remove('show');
    }

    function highlightSearchResults() {
      if (!graph || searchResults.length === 0) return;
      const ids = new Set(searchResults.map(r => r.id));
      graph.nodeColor(node => ids.has(node.id) ? '#ffff00' : node.color);
      document.getElementById('highlight-btn').disabled = false;
    }

    // ============================================
    // RECHERCHE
    // ============================================
    function initSearch() {
      const searchInput = document.getElementById('search-input');
      const searchResultsDiv = document.getElementById('search-results');
      const resultCountDiv = document.getElementById('result-count');

      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (query.length < 2) {
          searchResultsDiv.classList.remove('show');
          resultCountDiv.classList.remove('show');
          clearHighlight();
          return;
        }

        searchResults = projectsData.nodes.filter(node => {
          if (node.id.startsWith('year-') || node.id.startsWith('type-') || node.id.startsWith('tech-')) return false;
          const haystack = [
            node.name || '', node.shortDesc || '', node.longDesc || '',
            (node.keywords || []).join(' '), (node.tags || []).join(' '),
            (node.tech || []).join(' '), node.category || ''
          ].join(' ').toLowerCase();
          return haystack.includes(query);
        });

        if (searchResults.length > 0) {
          searchResultsDiv.innerHTML = searchResults.slice(0, 10).map(node => `
            <div class="search-result-item" onclick="focusOnNode('${escapeAttr(node.id)}')">
              <div class="name">${escapeHtml(node.name)}</div>
              <div class="meta">
                ${node.year ? `📅 ${node.year} | ` : ''}${node.category ? `📁 ${escapeHtml(node.category)} | ` : ''}${node.tech ? `💻 ${escapeHtml(node.tech.join(', '))}` : ''}
              </div>
            </div>
          `).join('');
          searchResultsDiv.classList.add('show');
          resultCountDiv.textContent = `${searchResults.length} résultat${searchResults.length > 1 ? 's' : ''}`;
          resultCountDiv.classList.add('show');
          document.getElementById('highlight-btn').disabled = false;
        } else {
          searchResultsDiv.innerHTML = '<div style="padding: 8px; color: #aaa;">Aucun résultat</div>';
          searchResultsDiv.classList.add('show');
          resultCountDiv.classList.remove('show');
          document.getElementById('highlight-btn').disabled = true;
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#search-container')) {
          searchResultsDiv.classList.remove('show');
        }
      });
    }

    function focusOnNode(nodeId) {
      if (!graph) return;
      const node = projectsData.nodes.find(n => n.id === nodeId);
      if (!node) return;

      graph.d3ReheatSimulation();

      const doFocus = () => {
        const nx = node.x || 0, ny = node.y || 0, nz = node.z || 0;
        const dist = 90;
        const mag = Math.hypot(nx, ny, nz) || 1;
        const ratio = 1 + dist / mag;
        graph.cameraPosition(
          { x: nx * ratio, y: ny * ratio, z: nz * ratio },
          { x: nx, y: ny, z: nz }, 1000
        );
      };
      requestAnimationFrame(() => requestAnimationFrame(doFocus));

      const ids = new Set([nodeId]);
      graph.nodeColor(n => ids.has(n.id) ? '#ffff00' : n.color);
      showNodeInfo(node);
      document.getElementById('search-results').classList.remove('show');
      document.getElementById('result-count').classList.remove('show');
      document.getElementById('search-input').value = '';
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').classList.remove('show');
      document.getElementById('result-count').classList.remove('show');
      clearHighlight();
      if (graph) graph.nodeColor(node => node.color);
    }

    // ============================================
    // RESIZE
    // ============================================
    let resizeTimeout = null;
    window.addEventListener('resize', () => {
      if (resizeTimeout) clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (graph) {
          const c = document.getElementById('container');
          graph.width(c.clientWidth);
          graph.height(c.clientHeight);
        }
      }, 100);
    });

    // ============================================
    // DÉMARRAGE
    // ============================================
    window.addEventListener('load', () => {
      setTimeout(initGraph, 50);
    });

    // ============================================
    // EXPOSITION GLOBALE (pour onclick inline)
    // ============================================
    window.focusOnNode = focusOnNode;
    window.clearSearch = clearSearch;
    window.highlightSearchResults = highlightSearchResults;
    window.resetView = resetView;
    window.toggleRotation = toggleRotation;
    window.toggleLabels = toggleLabels;
  </script>
</body>
</html>
