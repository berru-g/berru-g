            },
            {

                terms: { site: 3, vitrine: 3, cms: 3, ecommerce: 3, commerce: 3, boutique: 2, formulaire: 2, galerie: 2, refonte: 2 },
                desc: "Sites vitrine et CMS <strong>from scratch, sans template</strong> : formulaires, galeries, responsive, analytics intégrée. Indicatif : ~600 €, sur devis.",

                features: ['Suivi de transactions', 'Identification KYC', 'Guide crypto débutant'],

            },

                features: [CHAT_CFG.mail],

        /** Score chaque intent par mots-clés (même algo que le chatbot berru·faq) */
        function detectIntent(query) {
            const words = normalize(query).split(/[^a-z0-9]+/).filter(Boolean);
            const stems = words.map(w => w.slice(0, 6));
            let best = null, bestScore = 0;
            for (const it of INTENTS) {
                let s = 0;
                for (const [term, weight] of Object.entries(it.terms)) {
                    const t = normalize(term);
                    const match = (w) => w === t || (t.length >= 4 && w.length >= 4 && (w.startsWith(t) || t.startsWith(w)));
                    if (words.some(match) || stems.some(st => st.startsWith(t) && t.length >= 4)) s += weight;
                }
                if (s > bestScore) { bestScore = s; best = it; }
            }
            return bestScore >= 3 ? best : null; // seuil : au moins un mot-clé fort
        }

        // ======================================================================
        // RECHERCHE PROJETS / SERVICES (inchangée) + ASSISTANT en tête de liste
        // ======================================================================

        function calculateRelevance(project, term) {
            let r = 0;
            if (project.title.toLowerCase().includes(term)) r += 5;
            if (project.keywords.some(kw => kw === term)) r += 3;
            if (project.longDesc.toLowerCase().includes(term)) r += 2;
            if (project.shortDesc.toLowerCase().includes(term)) r += 1;
            return r;
        }

        function performExtendedSearch(searchTerm) {
            if (!searchTerm || searchTerm.length < 2) return hideProjectPreview();

            const term = searchTerm.toLowerCase();
            const intent = detectIntent(searchTerm);
            const matches = [];

            projectsDatabase.forEach(project => {
                const searchSpace = [project.title, project.shortDesc, project.longDesc,
                ...project.keywords, ...project.tags.map(t => t.toLowerCase())].join(' ').toLowerCase();
                if (searchSpace.includes(term)) {
                    matches.push({ type: 'project', data: project, relevance: calculateRelevance(project, term) });
                }
            });

            // Les services doublonnent les réponses de l'assistant :
            // quand l'assistant répond, on les laisse de côté.
            if (!intent) {
                servicesDatabase.forEach(service => {
                    const searchSpace = [service.title, service.desc, ...service.keywords].join(' ').toLowerCase();
                    if (searchSpace.includes(term)) matches.push({ type: 'service', data: service, relevance: 1 });
                });
            }

            matches.sort((a, b) => b.relevance - a.relevance);

            if (intent || matches.length) showProjectPreview(matches, intent);
            else showNoResults();
        }

        function showNoResults() {
            const mainContent = document.querySelector('.main-content');
            if (!mainContent) return;
            hideProjectPreview(true);
            let empty = document.getElementById('no-results');
            if (!empty) {
                empty = document.createElement('div');
                empty.id = 'no-results';
                empty.className = 'no-results';
                mainContent.prepend(empty);
            }
            const suggestions = ['tes services', 'tes tarifs', 'ta méthode', 'qui es-tu', 'libreanalytics', 'nfc', 'blockchain'];
            const chips = suggestions.map(s =>
                `<span class="preview-tag" style="cursor:pointer" onclick="fillSearch('${s}')"># ${s}</span>`
            ).join('');
            empty.innerHTML = `⌘ Aucun résultat — cherche un projet (api, arduino, blockchain…) ou pose ta question :<br>
                <div style="display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center; margin-top:0.9rem;">${chips}</div>`;
            empty.setAttribute('data-aos', 'fade-up');
            AOS.refreshHard();
        }

        /** Suggestion cliquable → remplit la barre et relance la recherche */
        function fillSearch(term) {
            searchInput.value = term;
            performExtendedSearch(term);
            searchInput.focus();
        }

        function showProjectPreview(matches, intent) {
            const mainContent = document.querySelector('.main-content');
            if (!mainContent) return;

            document.getElementById('no-results')?.remove();

            let preview = document.getElementById('dynamic-preview');
            if (!preview) {
                preview = document.createElement('div');
                preview.id = 'dynamic-preview';
                preview.className = 'dynamic-preview';
                mainContent.prepend(preview);
            }

            const badge = intent && matches.length
                ? `Assistant · ${matches.length === 1 ? '1 résultat' : matches.length + ' résultats'}`
                : intent
                    ? 'Assistant'
                    : (matches.length === 1 ? 'Projet correspondant' : matches.length + ' résultats');

            let html = `
    <div class="preview-header" data-aos="fade-down" data-aos-delay="100">
      <span class="preview-badge" data-aos="fade-down" data-aos-delay="200">${badge}</span>
      <button class="preview-close" onclick="hideProjectPreview()">×</button>
    </div>`;

            // --- Carte ASSISTANT (même gabarit qu'un résultat, en tête) ---
            if (intent) {
                html += `
        <div class="preview-content service-preview" data-aos="fade-up" data-aos-delay="500" data-aos-anchor-placement="top-bottom">
          <div class="preview-icon">${intent.icon}</div>
          <div class="preview-details">
            <h3 class="preview-title">${intent.title}</h3>
            <p class="preview-desc">${intent.desc}</p>
            ${intent.features.length ? `<div class="preview-features">${intent.features.map(f => `<span class="preview-feature">${f}</span>`).join('')}</div>` : ''}
            ${intent.linkLabel ? `<a href="${intent.linkUrl}" target="_blank" class="preview-link">${intent.linkLabel} →</a>` : ''}
          </div>
        </div>`;
            }

            // --- Résultats projets / services, en cascade derrière ---
            matches.forEach((m, i) => {
                const delay = (intent ? 620 : 500) + i * 120;

                if (m.type === 'project') {
                    const p = m.data;
                    html += `
        <div class="preview-content" data-aos="fade-up" data-aos-delay="${delay}" data-aos-anchor-placement="top-bottom">
          <div class="preview-image" data-aos="fade-down" data-aos-delay="150"><img src="${p.image}" alt="${p.title}" loading="lazy"></div>
          <div class="preview-details">
            <h3 class="preview-title" data-aos="fade-down" data-aos-delay="250">${p.title}</h3>
            <div class="preview-tags">${p.tags.map(t => `<span class="preview-tag"># ${t}</span>`).join('')}</div>
            <p class="preview-desc">${p.longDesc}</p>
            <div class="preview-features">${p.features.map(f => `<span class="preview-feature">${f}</span>`).join('')}</div>
            <a href="${p.link}" target="_blank" class="preview-link">Voir le projet →</a>
          </div>
        </div>`;
                } else {
                    const s = m.data;
                    html += `
        <div class="preview-content service-preview" data-aos="fade-up" data-aos-delay="${delay}">
          <div class="preview-icon">${s.icon}</div>
          <div class="preview-details">
            <h3 class="preview-title">${s.title}</h3>
            <p class="preview-desc">${s.desc}</p>
            <div class="preview-keywords">${s.keywords.map(k => `<span class="preview-keyword">#${k}</span>`).join('')}</div>
          </div>
        </div>`;
                }
            });

            preview.innerHTML = html;

            AOS.refreshHard();

            preview.style.opacity = '0';
            preview.style.transform = 'translateY(-14px)';
            requestAnimationFrame(() => {
                preview.style.transition = 'all 0.45s cubic-bezier(0.4, 0, 0.2, 1)';
                preview.style.opacity = '1';
                preview.style.transform = 'translateY(0)';
            });
        }

        function hideProjectPreview(instant = false) {
            document.getElementById('no-results')?.remove();
            const preview = document.getElementById('dynamic-preview');
            if (preview) {
                if (instant) return preview.remove();
                preview.style.opacity = '0';
                preview.style.transform = 'translateY(-14px)';
                setTimeout(() => preview.remove(), 400);
            }
        }

        // ===== ÉVÉNEMENTS =====
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.trim();
            if (checkEasterEgg(term)) return hideProjectPreview();
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => performExtendedSearch(term), 150);
        });

        document.addEventListener('keydown', (e) => {
            const tag = e.target.tagName.toLowerCase();
            const isInput = tag === 'input' || tag === 'textarea';
            if (e.key === '/' && !isInput) {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                searchInput.value = '';
                hideProjectPreview();
            }
        });
    </script>
